---
# Managed by modulesync - DO NOT EDIT
# https://voxpupuli.org/docs/updating-files-managed-with-modulesync/

name: 📦 Build and Publish

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Set up build matrix
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.build-matrix }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1

      - name: Generate build matrix
        id: build-matrix
        run: |
          matrix_json=$(yq -o=json build_platforms.yaml | jq -c)
          echo "build-matrix=$matrix_json" >> "$GITHUB_OUTPUT"

      - name: Determine semantic-release version
        id: version
        run: |
          echo "version=$(jq -r '.dependencies."semantic-release" | ltrimstr("^")' package.json)" >> "$GITHUB_OUTPUT"

      - name: Determine channel tag
        id: channel
        run: |
          echo "tag=$(echo '${{ github.ref_name }}' | sed 's/^main$/latest/')" >> "$GITHUB_OUTPUT"

  build-and-push-container:
    name: Build semantic-release (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs:
      - setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.build-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and publish container
        id: build
        uses: voxpupuli/gha-build-and-publish-a-container@f1680271a3fd34267c1401c760a15f45a9cf34ca # v2.0.0
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          build_arch: linux/${{ matrix.platform }}
          build_context: .
          buildfile: Containerfile
          tags: |
            ghcr.io/voxpupuli/semantic-release:sha-${{ github.sha }}-${{ matrix.platform }}

  create-multiarch-manifests:
    name: Create multi-architecture manifests
    runs-on: ubuntu-latest
    needs:
      - setup-matrix
      - build-and-push-container
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: voxpupulibot
          password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}

      - name: Create multi-architecture manifests
        run: |
          docker buildx imagetools create -t ghcr.io/voxpupuli/semantic-release:${{ needs.setup-matrix.outputs.version }}-${{ needs.setup-matrix.outputs.channel }} -t ghcr.io/voxpupuli/semantic-release:latest -t docker.io/voxpupuli/semantic-release:${{ needs.setup-matrix.outputs.version }}-${{ needs.setup-matrix.outputs.channel }} -t docker.io/voxpupuli/semantic-release:latest ghcr.io/voxpupuli/semantic-release:sha-${{ github.sha }}-amd64 ghcr.io/voxpupuli/semantic-release:sha-${{ github.sha }}-arm64

  update-dockerhub-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs:
      - create-multiarch-manifests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: voxpupulibot
          password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}
          repository: voxpupuli/semantic-release
